name: Build, smoke-test, and deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Dockerfile"
      - "requirements.txt"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: esm2-variant-effect-predictor
  LAMBDA_FUNCTION_NAME: esm2-variant-effect-predictor

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        id: build
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          docker build -t "$IMAGE_URI" -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Smoke test with the Lambda Runtime Interface Emulator
        env:
          IMAGE_URI: ${{ steps.build.outputs.image_uri }}
        run: |
          mkdir -p /tmp/rie
          curl -sSL -o /tmp/rie/aws-lambda-rie \
            https://github.com/aws/aws-lambda-runtime-interface-emulator/releases/latest/download/aws-lambda-rie
          chmod +x /tmp/rie/aws-lambda-rie

          docker run -d --name smoke-test -p 9000:8080 \
            -v /tmp/rie/aws-lambda-rie:/usr/local/bin/aws-lambda-rie:ro \
            --entrypoint /usr/local/bin/aws-lambda-rie \
            "$IMAGE_URI" /usr/local/bin/python -m awslambdaric lambda_handler.handler

          for i in $(seq 1 10); do
            sleep 3
            RESPONSE=$(curl -sS -X POST \
              "http://localhost:9000/2015-03-31/functions/function/invocations" \
              -d '{"sequence": "", "pos": 1713, "wt": "V", "mt": "G"}')
            if echo "$RESPONSE" | grep -q "esm2_score"; then
              echo "smoke test passed: $RESPONSE"
              exit 0
            fi
          done
          echo "smoke test failed -- no valid response after retries"
          docker logs smoke-test
          exit 1

      - name: Push image to ECR
        env:
          IMAGE_URI: ${{ steps.build.outputs.image_uri }}
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker push "$IMAGE_URI"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

      - name: Deploy to Lambda (if the function already exists)
        env:
          IMAGE_URI: ${{ steps.build.outputs.image_uri }}
        run: |
          if aws lambda get-function --function-name "$LAMBDA_FUNCTION_NAME" >/dev/null 2>&1; then
            aws lambda update-function-code \
              --function-name "$LAMBDA_FUNCTION_NAME" \
              --image-uri "$IMAGE_URI"
            aws lambda wait function-updated --function-name "$LAMBDA_FUNCTION_NAME"
            echo "Lambda function updated to $IMAGE_URI"
          else
            echo "Lambda function '$LAMBDA_FUNCTION_NAME' doesn't exist yet -- create it once from the console/CLI pointing at this image, then future pushes will auto-update it."
          fi
